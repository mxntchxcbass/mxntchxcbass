name: Update README Stats Cards

on:
  schedule:
    - cron: "0 3 * * *"   # 매일 03:00 UTC 자동 갱신
  workflow_dispatch: {}    # Actions 탭에서 수동 실행 버튼 생성
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=0D1117&title_color=F7931E&icon_color=F7931E&text_color=C9D1D9&ring_color=F7931E
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate top-langs card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&bg_color=0D1117&title_color=F7931E&text_color=C9D1D9
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README stats cards" || exit 0
          git push
