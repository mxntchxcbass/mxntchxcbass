name: Update README Stats Cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {} 
  push:
    paths:
      - README.md
      - .github/workflows/stats.yml

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          fail_on_error: true
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=0D1117&title_color=F7931E&icon_color=F7931E&text_color=C9D1D9&ring_color=F7931E
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN || github.token }}

      - name: Generate top-langs card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          fail_on_error: true
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&bg_color=0D1117&title_color=F7931E&text_color=C9D1D9
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN || github.token }}

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update README stats cards"
          git push
